<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0f172a"/>
    <stop offset="100%" stop-color="#1e293b"/>
  </linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity="0.25"/></filter>
</defs>
<rect width="100%" height="100%" fill="url(#bg)" rx="28"/>
<text x="60" y="70" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#ffffff">Main Types of Machine Learning</text>
<text x="600" y="135" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#1DB954">Machine Learning</text><rect x="80" y="190" width="320" height="230" rx="24" fill="#3b82f6" opacity="0.95" filter="url(#shadow)"/><text x="240" y="260" text-anchor="middle" font-family="Arial" font-size="27" font-weight="700" fill="#ffffff">Supervised Learning</text><text x="240" y="305" text-anchor="middle" font-family="Arial" font-size="21" fill="#f8fafc">Known target</text><text x="240" y="350" text-anchor="middle" font-family="Arial" font-size="19" fill="#ffffff">• Classification</text><text x="240" y="384" text-anchor="middle" font-family="Arial" font-size="19" fill="#ffffff">• Regression</text><rect x="430" y="190" width="320" height="230" rx="24" fill="#8b5cf6" opacity="0.95" filter="url(#shadow)"/><text x="590" y="260" text-anchor="middle" font-family="Arial" font-size="27" font-weight="700" fill="#ffffff">Unsupervised Learning</text><text x="590" y="305" text-anchor="middle" font-family="Arial" font-size="21" fill="#f8fafc">No target</text><text x="590" y="350" text-anchor="middle" font-family="Arial" font-size="19" fill="#ffffff">• Clustering</text><text x="590" y="384" text-anchor="middle" font-family="Arial" font-size="19" fill="#ffffff">• Pattern discovery</text><rect x="780" y="190" width="320" height="230" rx="24" fill="#f59e0b" opacity="0.95" filter="url(#shadow)"/><text x="940" y="260" text-anchor="middle" font-family="Arial" font-size="27" font-weight="700" fill="#ffffff">Reinforcement Learning</text><text x="940" y="305" text-anchor="middle" font-family="Arial" font-size="21" fill="#f8fafc">Reward feedback</text><text x="940" y="350" text-anchor="middle" font-family="Arial" font-size="19" fill="#ffffff">• Action</text><text x="940" y="384" text-anchor="middle" font-family="Arial" font-size="19" fill="#ffffff">• Reward / penalty</text>
</svg>